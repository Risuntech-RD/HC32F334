version: "4.1"
name: XHCODE
type: ARM
deviceName: HC32F334JATI
packDir: .pack/HDSC/HC32F334.1.0.0
srcDirs:
  - CMSIS
  - common
  - driver
  - GCC
  - source
  - PSFB
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 6629bcf8ee0f161f756c31bb003c0836
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - __DEBUG
        - HC32F334
        - USE_DDL_DRIVER
      incList:
        - .
        - CMSIS/Core/Include
        - common
        - driver/inc
        - source
        - PSFB
      libList: []
    excludeList:
      - source/DAB_3ph_strategy.lib
      - common/system_hc32f334_clock.c
      - PSFB/psfb_hc_init.c
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: -D__DEBUG -DHC32F334 -DUSE_DDL_DRIVER
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: gnu99
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-0
            signed-char: true
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control:
              - -fmessage-length=0
              - -mthumb-interwork
              - -Wall
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: ./GCC/HC32F334xA.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: HC32F334xA
          vendor: HDSC
        otherCmds: -NoGui 1 -ExitOnError 1
        proType: 1
        speed: 20000
      OpenOCD:
        baseAddr: "0x00000000"
        bin: ""
        interface: cmsis-dap
        target: ${workspaceFolder}/hc32f334
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
      pyOCD:
        baseAddr: "0x00000000"
        bin: ""
        config: .eide/debug.pyocd.yaml
        otherCmds: ""
        speed: 20M
        targetName: hc32f334jati
    uploader: JLink
  Release:
    cppPreprocessAttrs:
      defineList: []
      incList: []
      libList: []
    excludeList: []
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-size
            signed-char: true
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control:
              - -fmessage-length=0
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: ""
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
